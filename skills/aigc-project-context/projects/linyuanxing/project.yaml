      派生参考，不是原始源。与分镜表冲突时，以分镜表为准。

source_precedence:
  composition: [current_user, assigned_current_asset, ep02-storyboard, ep01-storyboard]
  action:      [current_user, ep02-storyboard, ep01-storyboard, series-bible]
  dialogue:    [current_user, ep02-storyboard, ep01-storyboard]
  identity:    [current_user, assigned_current_asset, ep01-storyboard, ep02-storyboard, series-bible]
  worldbuilding: [current_user, ep01-storyboard, ep02-storyboard, series-bible]

assets: []
# 目前包内没有角色设定图、场景概念图或参考帧。
# 收到可读的角色/场景图后，在此登记 state 与 roles，未登记的资产不控制任何字段。

defaults:
  medium: "3D 国漫电影质感"
  audio: "无配乐、无旁白、无字幕，仅环境声与角色现场对白"
  visible_text: "画面内无文字"
# audio 默认取自 EP01 6-1 场景氛围描述栏中唯一一条完整写明的氛围设定；
# 它是该行的原文，作为项目默认沿用，被任何单镜的明确指定覆盖。

exclusions: []

context:
  prepared: "contexts"
  raw_storyboard: "sources"
  bible: "contexts/series-bible.md"

conventions:
  shot_id: "<场次序号>-<镜序号>，例：14-42；同一镜的拆分用字母后缀，例：6-19A / 8-1B / 12-15B"
  columns_ep01: [场次, 镜号, 场景, 场景副本, 场景氛围描述, 景别/角度, 运镜, 画面描述, 对白]
  columns_ep02: [场次, 镜号, 场景, 景别/角度, 运镜, 画面描述, 对白]
  notes: >-
    EP01 的「场景 副本」列与「场景」列内容完全相同，转换时已丢弃。
    EP01 的「场景氛围描述」列同时承载氛围设定和制作备注（如「注意灯笼光源」），
    转换后合并为「场景氛围描述/备注」列，原文未改。
