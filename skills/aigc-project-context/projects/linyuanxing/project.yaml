    data_range: "A1:I412"
    raw_dimension: "A1:AE412"
    sha256: "F00AA47DA4F43DB5339A5563BDA8EA2BA646FFC89194B4D1BFDD9D90B3704B4E"
  - id: ep02-storyboard
    type: storyboard
    path: "sources/EP02-分镜表.xlsx"
    readable_context: "contexts/EP02-storyboard.md"
    version: "收录于 2026-07-30"
    scope: "第二集　第一场–第三场　92 个分镜行（1-1 至 3-27，未完成）"
    status: current_partial
