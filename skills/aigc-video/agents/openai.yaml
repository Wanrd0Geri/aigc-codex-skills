interface:
  display_name: "AIGC Video"
  short_description: "Create or review Seedance 2.5 and platform-neutral video prompts."
  default_prompt: "用 $aigc-video 根据 brief、素材、项目上下文或已生成成片，写出、优化或回检可直接使用的视频提示词。Seedance 2.5 默认用统一时间轴结构，素材按上传顺序写成‘图片1：用途’，不虚构 @ 标识；若缺少会影响成片的时长或关键边界，再集中问我。"
policy:
  allow_implicit_invocation: true
